    const TikTokExtractor = (function() {
      const DB_NAME = 'TikTokExtractor';
      const DB_VERSION = 2;
      const STORES = { FULL: 'fullData', EXTRACTED: 'extracted' };

      async function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onerror = () => reject(req.error);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORES.FULL)) db.createObjectStore(STORES.FULL);
            if (!db.objectStoreNames.contains(STORES.EXTRACTED)) db.createObjectStore(STORES.EXTRACTED);
          };
          req.onsuccess = () => resolve(req.result);
        });
      }

      async function loadFullData(db) {
        if (!db.objectStoreNames.contains(STORES.FULL)) return null;
        const tx = db.transaction(STORES.FULL, 'readonly');
        const store = tx.objectStore(STORES.FULL);
        return new Promise((resolve, reject) => {
          const req = store.get('data');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function saveExtracted(data, key = 'latest') {
        const db = await openDB();
        const tx = db.transaction(STORES.EXTRACTED, 'readwrite');
        const store = tx.objectStore(STORES.EXTRACTED);
        return new Promise((resolve, reject) => {
          const req = store.put(data, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async function loadExtracted(key = 'latest') {
        const db = await openDB();
        if (!db.objectStoreNames.contains(STORES.EXTRACTED)) return null;
        const tx = db.transaction(STORES.EXTRACTED, 'readonly');
        const store = tx.objectStore(STORES.EXTRACTED);
        return new Promise((resolve, reject) => {
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function clearExtracted(key = 'latest') {
        const db = await openDB();
        if (!db.objectStoreNames.contains(STORES.EXTRACTED)) return;
        const tx = db.transaction(STORES.EXTRACTED, 'readwrite');
        const store = tx.objectStore(STORES.EXTRACTED);
        return new Promise((resolve, reject) => {
          const req = store.delete(key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async function storeFullData(data) {
        const db = await openDB();
        const tx = db.transaction(STORES.FULL, 'readwrite');
        const store = tx.objectStore(STORES.FULL);
        return new Promise((resolve, reject) => {
          const req = store.put(data, 'data');
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async function clearFullData() {
        const db = await openDB();
        if (!db.objectStoreNames.contains(STORES.FULL)) return;
        const tx = db.transaction(STORES.FULL, 'readwrite');
        const store = tx.objectStore(STORES.FULL);
        return new Promise((resolve, reject) => {
          const req = store.delete('data');
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }
      
async function getStoreNames() {
  const db = await openDB();
  const storeNames = Array.from(db.objectStoreNames);
  db.close();
  return storeNames;
}




      // Helper functions (simplified)
      function traversePath(obj, segments, context = {}) {
        if (!obj || segments.length === 0) return obj ? [{ value: obj, context }] : [];
        const [curr, ...rest] = segments;
        if (curr === '*') {
          if (typeof obj !== 'object' || obj === null) return [];
          const results = [];
          for (const key in obj) {
            if (Object.prototype.hasOwnProperty.call(obj, key)) {
              results.push(...traversePath(obj[key], rest, { ...context, _wildcard: key }));
            }
          }
          return results;
        } else {
          const next = obj[curr];
          return next === undefined ? [] : traversePath(next, rest, context);
        }
      }

      function mapFields(item, columnMap) {
        const row = {};
        for (const [src, tgt] of Object.entries(columnMap)) {
          if (item[src] !== undefined) row[tgt] = item[src];
        }
        return row;
      }

      function processValue(value, mapping, context = {}) {
        const { table, columns, isArray } = mapping;
        const rows = [];
        const arr = isArray ? (Array.isArray(value) ? value : []) : [value];
        for (const item of arr) {
          if (item && typeof item === 'object') {
            const row = mapFields(item, columns);
            if (context._wildcard !== undefined) row.wildcard_key = context._wildcard;
            rows.push(row);
          }
        }
        return rows;
      }

      function checkMissingMappings(data) {
        const missing = [];
        for (const pathStr of Object.keys(window.JIK_PATH_MAPPING)) {
          const segments = pathStr.split('.');
          const matches = traversePath(data, segments);
          if (matches.length === 0) missing.push(pathStr);
        }
        return missing;
      }

      return {
        async extractData() {
          if (!window.JIK_PATH_MAPPING) throw new Error('JIK_PATH_MAPPING not found');
          const db = await openDB();
          const data = await loadFullData(db);
          if (!data) throw new Error('No data found in IndexedDB. Please upload a TikTok JSON file first.');
          const extracted = {};
          for (const [pathStr, mapping] of Object.entries(window.JIK_PATH_MAPPING)) {
            const segments = pathStr.split('.');
            const matches = traversePath(data, segments);
            for (const { value, context } of matches) {
              if (value == null) continue;
              const rows = processValue(value, mapping, context);
              const tableName = mapping.table;
              if (!extracted[tableName]) extracted[tableName] = [];
              extracted[tableName].push(...rows);
            }
          }
          return extracted;
        },
        findFriends: (arrA, arrB, key) => {
          const mapB = new Map(arrB.map(item => [item[key], item]));
          return arrA.filter(a => mapB.has(a[key])).map(a => ({ [key]: a[key], date_following: a.date, date_follower: mapB.get(a[key]).date }));
        },
        removeFollower: (obj, keyName) => { const o = { ...obj }; delete o[keyName]; return o; },
        removeNullOrNA: (arr, key) => arr.filter(item => {
          const val = item[key];
          return val !== null && !(typeof val === 'string' && val.toUpperCase() === 'N/A');
        }),
        saveExtracted,
        loadExtracted,
        clearExtracted,
        storeFullData,
        clearFullData,
        checkMissingMappings,
        getStoreNames
      };
    })();

    // ========== UI and event handlers ==========
    (function() {
      // Toast helper
      const toast = document.getElementById('toast');
      function showToast(message, type = 'info', duration = 3000) {
        toast.textContent = message;
        toast.className = `show ${type}`;
        setTimeout(() => toast.classList.remove('show'), duration);
      }

      // DOM elements
      const runBtn = document.getElementById('run');
      const downloadBtn = document.getElementById('downloadBtn');
      const storeBtn = document.getElementById('storeExtracted');
      const clearBtn = document.getElementById('clearExtracted');
      const loadBtn = document.getElementById('loadExtracted');
      const uploadBtn = document.getElementById('uploadBtn');
      const fileInput = document.getElementById('uploadFileInput');
      const clearFullBtn = document.getElementById('clearFullDataBtn');
      const saveAsUserBtn = document.getElementById('saveCleanedAsUserBtn');
      const summaryContainer = document.getElementById('summaryTableContainer');
      const logViewer = document.getElementById('logViewer');

      let currentExtracted = null;

      function addLog(message, type = 'info') {
        if (!logViewer) return;
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logViewer.appendChild(entry);
        logViewer.scrollTop = logViewer.scrollHeight;
      }

      function renderSummaryTable(extracted) {
        const tableNames = Object.keys(extracted);
        let html = '<table class="result-table"><thead><tr><th>#</th><th>Table Name</th><th>Count</th><th>Actions</th></tr></thead><tbody>';
        tableNames.sort().forEach((name, index) => {
          const count = extracted[name].length;
          html += `<tr><td>${index + 1}</td><td>${name}</td><td>${count.toLocaleString()}</td><td><i class="fa-regular fa-eye view-icon" data-table="${name}"></i></td></tr>`;
        });
        html += '</tbody></table>';
        summaryContainer.innerHTML = html;
      }

      function openModal(tableName) {
        if (!currentExtracted || !currentExtracted[tableName]) return;
        const data = currentExtracted[tableName];
        const sample = data.slice(0, 5);
        const columns = sample.length > 0 ? Object.keys(sample[0]) : [];
        let sampleHtml = '<table class="sample-table"><thead><tr>';
        columns.forEach(col => sampleHtml += `<th>${col}</th>`);
        sampleHtml += '</tr></thead><tbody>';
        sample.forEach(row => {
          sampleHtml += '<tr>';
          columns.forEach(col => {
            let val = row[col];
            if (val === null || val === undefined) val = '';
            if (typeof val === 'object') val = JSON.stringify(val).slice(0, 50);
            sampleHtml += `<td>${val}</td>`;
          });
          sampleHtml += '</tr>';
        });
        sampleHtml += '</tbody></table>';

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
          <div class="modal-content">
            <div class="modal-header">
              <h3>${tableName} (first 5 rows)</h3>
              <button class="close-modal">&times;</button>
            </div>
            ${sampleHtml}
          </div>
        `;
        document.body.appendChild(overlay);
        overlay.querySelector('.close-modal').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', esc); } });
      }

      // Run extraction
      runBtn.addEventListener('click', async () => {
        summaryContainer.innerHTML = '';
        addLog('Starting extraction...', 'info');
        try {
          const extracted = await TikTokExtractor.extractData();
          addLog(`Extracted raw data with ${Object.keys(extracted).length} tables`, 'info');

          const followers = extracted.followers || [];
          const following = extracted.following || [];

          if (window.cleaned) {
            extracted.friends = TikTokExtractor.findFriends(following, followers, 'username');
            addLog(`Friends table created with ${extracted.friends.length} mutual entries`, 'info');
            delete extracted.followers;
            addLog('Removed followers table', 'info');
            if (extracted.friends) extracted.friends = TikTokExtractor.removeNullOrNA(extracted.friends, 'username');
            if (extracted.following) extracted.following = TikTokExtractor.removeNullOrNA(extracted.following, 'username');
            addLog('Cleaned null/NA entries', 'info');
          }

          currentExtracted = extracted;
          renderSummaryTable(extracted);
          document.getElementById("username").innerText = extracted.users[0].username;
          addLog('Extraction complete. Click the eye icon to preview data.', 'success');
        } catch (err) {
          addLog(`Error: ${err.message}`, 'error');
          showToast(err.message, 'error');
        }
      });

      summaryContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('view-icon')) {
          openModal(e.target.getAttribute('data-table'));
        }
      });

      uploadBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          await TikTokExtractor.storeFullData(data);
          addLog(`Stored full data from ${file.name}`, 'success');
          showToast('Full data stored successfully', 'success');
          const missing = TikTokExtractor.checkMissingMappings(data);
          if (missing.length > 0) {
            addLog(`Missing mappings for: ${missing.join(', ')}`, 'warn');
            showToast('Some mappings are missing – check log', 'info');
          }
        } catch (err) {
          addLog(`Upload error: ${err.message}`, 'error');
          showToast('Error reading JSON file', 'error');
        } finally {
          fileInput.value = '';
        }
      });

      clearFullBtn.addEventListener('click', async () => {
        try {
          await TikTokExtractor.clearFullData();
          addLog('Full data cleared from IndexedDB', 'success');
          showToast('Full data cleared', 'success');
        } catch (err) {
          addLog(`Error clearing full data: ${err.message}`, 'error');
          showToast('Error clearing full data', 'error');
        }
      });

      saveAsUserBtn.addEventListener('click', async () => {
        if (!currentExtracted) {
          addLog('No extracted data to save. Run extraction first.', 'warn');
          showToast('No data to save', 'warn');
          return;
        }
        let username = 'unknown';
        if (currentExtracted.users && currentExtracted.users.length > 0 && currentExtracted.users[0].username) {
          username = currentExtracted.users[0].username;
        }
        try {
          await TikTokExtractor.saveExtracted(currentExtracted, username);
          addLog(`Saved extracted data under key "${username}"`, 'success');
          showToast(`Saved as ${username}`, 'success');
        } catch (err) {
          addLog(`Error saving: ${err.message}`, 'error');
          showToast('Error saving data', 'error');
        }
      });

      storeBtn.addEventListener('click', async () => {
        if (!currentExtracted) {
          addLog('No extracted data to store. Run extraction first.', 'warn');
          return;
        }
        try {
          await TikTokExtractor.saveExtracted(currentExtracted);
          addLog('Extracted data stored under key "latest".', 'success');
          showToast('Stored as latest', 'success');
        } catch (err) {
          addLog(`Error storing: ${err.message}`, 'error');
          showToast('Error storing data', 'error');
        }
      });

      loadBtn.addEventListener('click', async () => {
        addLog('Loading extracted data from database...', 'info');
        try {
          const extracted = await TikTokExtractor.loadExtracted();
          if (!extracted) {
            addLog('No extracted data found in database.', 'warn');
            return;
          }
          currentExtracted = extracted;
          renderSummaryTable(extracted);
          document.getElementById("username").innerText = extracted.users[0].username;
          addLog('Extracted data loaded successfully.', 'success');
          showToast('Data loaded', 'success');
        } catch (err) {
          addLog(`Error loading: ${err.message}`, 'error');
          showToast('Error loading data', 'error');
        }
      });

      clearBtn.addEventListener('click', async () => {
        try {
          await TikTokExtractor.clearExtracted();
          addLog('Extracted data cleared from database (latest).', 'success');
          showToast('Cleared latest', 'success');
        } catch (err) {
          addLog(`Error clearing: ${err.message}`, 'error');
          showToast('Error clearing data', 'error');
        }
      });

      downloadBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!currentExtracted) {
          addLog('No extracted data to download. Run extraction first.', 'warn');
          return;
        }
        let filename = 'extracted_data.json';
        if (currentExtracted.users && currentExtracted.users.length > 0 && currentExtracted.users[0].username) {
          filename = `${currentExtracted.users[0].username}_extracted.json`;
        }
        const jsonStr = JSON.stringify(currentExtracted, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        addLog(`Downloaded as ${filename}`, 'success');
      });

      // Theme toggle
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const body = document.body;
          if (body.classList.contains('light-theme')) {
            body.classList.replace('light-theme', 'dark-theme');
            themeToggle.innerHTML = '<i class="fa-regular fa-moon"></i>';
          } else {
            body.classList.replace('dark-theme', 'light-theme');
            themeToggle.innerHTML = '<i class="fa-regular fa-sun"></i>';
          }
        });
      }

      // Tab switching
      const tabButtons = document.querySelectorAll('.custom-tab-btn');
      const panes = document.querySelectorAll('.custom-tab-pane');
      tabButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          tabButtons.forEach(b => b.classList.remove('active'));
          panes.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
        });
      });
    })();
  </script>
